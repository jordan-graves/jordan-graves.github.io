<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Model Viewer Switcher</title>
    
    <!-- 1. Import the <model-viewer> library -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: sans-serif;
            background-color: #f4f4f9;
        }

        /* 2. Style the viewer container */
        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }

        /* 3. Style the model switcher controls */
        .model-switcher {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 6px;
            border-radius: 8px;
            box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.15);
            z-index: 999;
        }

        .switch-btn {
            background-color: transparent;
            border: none;
            border-radius: 6px;
            color: #3c4043;
            cursor: pointer;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            transition: background-color 0.2s, color 0.2s;
        }

        .switch-btn:hover {
            background-color: #f1f3f4;
        }

        .switch-btn.active {
            background-color: #4285f4;
            color: #ffffff;
        }

        /* 4. Style the custom AR button */
        #ar-button {
            background-color: #ffffff;
            border-radius: 4px;
            border: none;
            box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.25);
            color: #4285f4;
            display: block;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: 500;
            height: 42px;
            line-height: 42px;
            padding: 0 16px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 32px;
            z-index: 999;
        }

        #ar-button:active {
            background-color: #f1f3f4;
        }

        #ar-button:focus {
            outline: none;
        }

        #ar-button:focus-visible {
            outline: 1px solid #4285f4;
        }
    </style>
</head>
<body>

    <!-- Model Selection Buttons -->
    <div class="model-switcher">
        <button class="switch-btn active" onclick="switchModel(this, 'windows.glb', 'windows.usdz', '45deg 75deg 105%')">
            Small Corners
        </button>
        <button class="switch-btn" onclick="switchModel(this, 'Untitled2.glb', 'Untitled2.usdz', '45deg 75deg 105%')">
            Large Corners
        </button>
        <button class="switch-btn" onclick="switchModel(this, 'Untitled3.glb', 'Untitled3.usdz', '45deg 75deg 105%')">
            Mixed Corners
        </button>
    </div>

    <!-- The Model Viewer Component -->
    <model-viewer 
        id="viewer"
        src="windows.glb" 
        ios-src="windows.usdz"
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        touch-action="pan-y"
        camera-orbit="45deg 95deg 105%"
        alt="A 3D model viewed in AR"
        shadow-intensity="1">
        
        <button slot="ar-button" id="ar-button">
            👋 View in your space
        </button>
        
    </model-viewer>

    <script>
        const viewer = document.getElementById('viewer');
        const buttons = document.querySelectorAll('.switch-btn');

        function switchModel(clickedBtn, glbPath, usdzPath, orbit) {
            // Update the 3D model files
            viewer.src = glbPath;
            viewer.setAttribute('ios-src', usdzPath);
            
            // Optional: Set a custom starting camera angle per model
            if (orbit) {
                viewer.cameraOrbit = orbit;
            }

            // Update active button styling
            buttons.forEach(btn => btn.classList.remove('active'));
            clickedBtn.classList.add('active');
        }
    </script>

</body>
</html>
