    /* ==========================================================================
       1. Global Resets & Design Tokens
       ========================================================================== */
    :root {
      --bg-color: #ffffff;
      --text-color: #111111;
      --text-muted: #666666;
      --border-color: #e5e5e5;
      --nav-height: 55px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: var(--text-color);
      line-height: 1.5;
      overflow-x: hidden;
      background-color: white;
      
      /* Flex layout to stretch elements vertically */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      display: block;
      pointer-events: none;
    }

    #bg::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(0deg, #039c8a 30%, rgb(0, 0, 98) 50%, rgb(255, 98, 98) 70%);
      -webkit-mask-image: url("lines.png");
      mask-image: url("lines.png");
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ==========================================================================
       2. Sticky Navigation Bar
       ========================================================================== */
    nav.sticky-nav {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--nav-height);
      z-index: 1000;
      background-color: black;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5%;
      flex-shrink: 0;
    }

    .nav-logo {
      font-size: clamp(1rem, 1.4vw, 1.5rem);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      color: white;
    }

    nav ul {
      display: flex;
      gap: 1.75rem;
      list-style: none;
    }

    /* Ensure list items and anchor links align using flexbox */
nav ul li {
  display: flex;
  align-items: center;
}

nav a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* Size SVG relative to cap-height and prevent layout shifts */
nav a.nav-cart-link svg {
  display: block;
  width: auto;
  /* Matches cap height of Hanken Grotesk text links */
  height: 0.9em; 
  fill: currentColor;
  /* Slight optical adjustment to seat centered with capital letters */
  transform: translateY(-0.05em); 
}

/* Thicken the icon path lines */
nav a.nav-cart-link svg path {
  stroke: currentColor;
  stroke-width: 0.75px; /* Adjust between 0.5px and 1.2px to dial in boldness */
  stroke-linejoin: round;
}

#projectInfoWrapper {
  margin-inline: 10vw;
}

    nav a {
      font-size: clamp(1rem, 1.4vw, 1.5rem);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 500;
      position: relative;
      padding-bottom: 3px;
      color: white;
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0%;
      height: 1px;
      background: white;
      transition: width 0.3s ease;
    }

    nav a:hover::after,
    nav a.active::after {
      width: 100%;
    }

    /* ==========================================================================
       3. Content Area Container
       ========================================================================== */
    .content-area {
      flex: 0 0 auto;
      width: 100%;
      background-color: #ffffff;
      min-height: 60vh; /* Adjust or remove as needed */
    }

    /* ==========================================================================
       4. Full-Height Site Footer
       ========================================================================== */
    footer.site-footer {
      flex: 1; /* Takes up all remaining vertical space */
      padding: 2.5rem 5%;
      background-color: #000000;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1.5rem;
      color: white;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      width: 100%;
    }

    .footer-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      white-space: nowrap;
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .footer-link {
      font-size: clamp(0.95rem, 1.2vw, 1.15rem);
      font-weight: 500;
      border-bottom: 1px solid white;
      padding-bottom: 2px;
      transition: opacity 0.2s ease;
      white-space: nowrap;
    }

    .footer-link:hover { opacity: 0.6; }

    /* ==========================================================================
       5. Responsive Breakpoints
       ========================================================================== */
    @media (max-width: 768px) {
      #bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        height: -webkit-fill-available;
        z-index: -1;
        display: block;
        background-blend-mode: lighten;
        -webkit-transform: translate3d(0, 0, 0);
        transform: translate3d(0, 0, 0);
        pointer-events: none;
      }

      #bg::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(0deg, rgb(3, 156, 138) 30%, rgb(0, 0, 98) 50%, rgb(255, 98, 98) 70%);
        -webkit-mask-image: url("lines2.png");
        mask-image: url("lines2.png");
      }

      nav ul {
        gap: 0.85rem;
      }

      nav a {
        font-size: 0.75rem;
        letter-spacing: 0.04em;
      }

      footer.site-footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
        padding: 1.5rem 5%;
        justify-content: flex-start;
      }

      .footer-links {
        gap: 1.25rem;
        width: 100%;
      }
    }
  </style>
