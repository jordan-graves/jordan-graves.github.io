<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jordan Oleson-Graves</title>
  <link rel="icon" type="image/png" href="/assets/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="shortcut icon" href="/assets/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" type="text/css" href="/assets/style.css">
</head>
<body>
  <div id="bg"></div>

  <nav class="sticky-nav">
    <div class="nav-logo"><a href="/">JORDAN OLESON-GRAVES</a></div>
    <ul>
      <li class="nav-item-has-submenu">
        <a href="/" class="active">Work </a>
        <ul class="submenu" id="work-submenu">
        </ul>
      </li>
      <li><a href="/about">About</a></li>
      <li><a href="/shop">Shop</a></li>
      <li>
        <a href="../shop#!/~/cart" class="nav-cart-link" aria-label="Shopping Cart">
          <svg viewBox="0 0 16 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <g fill="none" fill-rule="evenodd">
              <path
                d="M1 5v13.006c0 .548.446.994.994.994h12.012c.548 0 .994-.446.994-.994V5H1zm15-1v14.006c0 1.1-.895 1.994-1.994 1.994H1.994C.894 20 0 19.105 0 18.006V4h16z"
                fill="currentColor" fill-rule="nonzero"></path>
              <path
                d="M5 7s-.005.5-.504.5C3.996 7.5 4 7 4 7V4c0-2.21 1.79-4 4-4s4 1.79 4 4v3s-.002.5-.5.5S11 7 11 7V4c0-1.657-1.343-3-3-3S5 2.343 5 4v3z"
                fill="currentColor"></path>
            </g>
          </svg>
        </a>
      </li>
    </ul>
  </nav>

  <main id="work">
    <div class="loading-state">
      <div class="spinner"></div>
      <span class="loading-text"></span>
    </div>
  </main>

  <footer class="site-footer" id="contact">
    <span class="footer-label">Get in Touch</span>
    <div class="footer-links">
      <a href="mailto:jordan@jordangrav.es" class="footer-link">jordan@jordangrav.es</a>
      <a href="https://instagram.com/jordanolesongraves" target="_blank" rel="noopener" class="footer-link">@jordanolesongraves</a>
    </div>
    
  </footer>

  <script>
  document.addEventListener('DOMContentLoaded', () => {

    const workNavItem = document.querySelector('.nav-item-has-submenu');
    const workLink = workNavItem?.querySelector('a');

    if (workNavItem && workLink) {
      workLink.addEventListener('click', (e) => {
        if (window.innerWidth <= 768) {
          if (!workNavItem.classList.contains('mobile-open')) {
            e.preventDefault();
            e.stopPropagation();
            workNavItem.classList.add('mobile-open');
          }
        }
      });

      document.addEventListener('click', (e) => {
        if (!workNavItem.contains(e.target)) {
          workNavItem.classList.remove('mobile-open');
        }
      });
    }

    window.addEventListener('scroll', () => {
      const bg = document.getElementById('bg');
      if (!bg) return;
      
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      if (maxScroll <= 0) return;

      const scrollFraction = Math.min(Math.max(window.scrollY / maxScroll, 0), 1);
      const extraWidth = bg.offsetWidth - window.innerWidth;
      const translateX = -extraWidth * (1 - scrollFraction);

      bg.style.transform = `translate3d(${translateX}px, 0, 0)`;
    });

    const leftArrowSVG = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><path d='M20 6 L10 16 L20 26' stroke='%23111111' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>`;
    const rightArrowSVG = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><path d='M12 6 L22 16 L12 26' stroke='%23111111' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>`;

     async function loadProjects() {
      try {
        const response = await fetch('/assets/projects.json');
        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
        const projects = await response.json();
        renderProjects(projects);
        initializeGalleryInteractions();
      } catch (error) {
        console.warn('Fetching projects.json directly failed. Loading fallback dataset.', error);
        renderProjects(getFallbackData());
        initializeGalleryInteractions();
      }
    }

    function renderMediaItem(item) {
      if (item.type === 'video') {
        const videoSrc = item.src || (item.sources && item.sources[0] ? item.sources[0].src : '');

        return `
          <video 
          target-live-window="0"
  max-resolution="1080p"
  min-resolution="1080p"
  muted
            src="${videoSrc}" 
            controls 
            playsinline 
            preload="metadata" 
            controlsList=""
            class="portfolio-video">
          </video>
        `;
      }
      
      return `<img src="${item.src}" alt="${item.alt || ''}" loading="lazy" />`;
    }

    function renderProjects(projects) {
      const container = document.getElementById('work');
      if (!container) return;
      
      container.innerHTML = projects.map((proj, idx) => {
        let theme = 'red';
        switch (idx % 4) {
          case 0: theme = 'red'; break;
          case 1: theme = 'blue'; break;
          case 2: theme = 'black'; break;
          default: theme = 'teal';
        }

        const featuredHTML = (proj.featuredMedia && proj.featuredMedia.length)
          ? `
            <div class="project-featured-media">
              ${proj.featuredMedia.map(item => `
                <div class="featured-media-wrapper">
                  <div class="featured-media-item">
                    ${renderMediaItem(item)}
                  </div>
                  ${item.caption ? `<div class="featured-item-caption">${item.caption}</div>` : ''}
                </div>
              `).join('')}
            </div>
          `
          : '';

        return `
          <section class="project-section" id="${proj.id}" data-theme="${theme}">
            <div class="project-info">
              <div class="project-info-sticky">
                <h2>${proj.title}</h2>
                <div class="view-series-trigger">
                  <span class="expand-prompt">View Series +</span>
                </div>
              </div>
            </div>

            <!-- ORIGINAL PREVIEW GALLERY (Always Visible) -->
            <div class="project-gallery-container">
              <div class="project-gallery-wrapper">
                <div class="project-gallery-track">
                  ${(proj.mainGallery || []).map(item => `
                    <div class="gallery-item" data-index="${item.index}">
                      <div class="gallery-item-image-wrapper">
                        ${renderMediaItem(item)}
                      </div>
                      <div class="gallery-item-caption">${item.caption || ''}</div>
                    </div>
                  `).join('')}
                  <div class="carousel-end-link">
                    <span class="expand-prompt">View Series +</span>
                  </div>
                  <div class="gallery-spacer"></div>
                </div>
              </div>
            </div>

            <!-- EXPANDED SERIES SECTION -->
            <div class="series-expansion">
              <div class="series-expansion-inner">
                
                <!-- 1. Description -->
                <div class="series-long-description">
                  ${(proj.description || []).map(p => `<p>${p}</p>`).join('')}
                </div>

                <!-- 2. Full-Width Featured / Highlighted Media -->
                ${featuredHTML}

                <!-- 3. Additional Images / Archive Grid -->
                <div class="extra-images-section">
                  <div class="extra-images-header">${proj.archiveHeader || ''}</div>
                  <div class="extra-images-grid">
                    ${(proj.archiveGrid || []).map(item => `
                      <div class="grid-item">
                        <div class="grid-item-media">
                          ${renderMediaItem(item)}
                        </div>
                        <span class="grid-item-caption">${item.caption || ''}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>

              </div>
            </div>
          </section>
        `;
      }).join('');

      populateWorkSubmenu(projects);
    }

    function populateWorkSubmenu(projects) {
      const submenu = document.getElementById('work-submenu');
      if (!submenu || !Array.isArray(projects)) return;

      submenu.innerHTML = projects.map((proj, idx) => {
        const targetId = proj.id || `project-${idx}`;
        return `
          <li>
            <a href="#${targetId}" class="submenu-link" data-target="${targetId}">
              ${proj.title}
            </a>
          </li>
        `;
      }).join('');

      submenu.querySelectorAll('.submenu-link').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const targetId = link.getAttribute('data-target');
          
          let targetSection = document.getElementById(targetId);
          if (!targetSection) {
            const allSections = document.querySelectorAll('.project-section');
            const index = parseInt(targetId.replace('project-', ''), 10);
            if (!isNaN(index) && allSections[index]) {
              targetSection = allSections[index];
            }
          }

          if (targetSection) {
            const navHeight = document.querySelector('.sticky-nav')?.offsetHeight || 70;
            const elementPosition = targetSection.getBoundingClientRect().top;
            const offsetPosition = elementPosition + window.pageYOffset - navHeight - 15;

            window.scrollTo({
              top: offsetPosition,
              behavior: 'smooth'
            });

            document.querySelector('.nav-item-has-submenu')?.classList.remove('mobile-open');
          }
        });
      });
    }

  function initializeGalleryInteractions() {

      const toggleSeries = (section) => {
        if (!section) return;

        const isOpening = !section.classList.contains('expanded');
        const navHeight = document.querySelector('.sticky-nav')?.offsetHeight || 70;

        if (isOpening) {
          const currentlyOpen = document.querySelector('.project-section.expanded');

          if (currentlyOpen && currentlyOpen !== section) {
            currentlyOpen.classList.remove('expanded');
            currentlyOpen.querySelectorAll('.expand-prompt').forEach(p => p.textContent = 'View Series +');
          }

          section.classList.add('expanded');
          section.querySelectorAll('.expand-prompt').forEach(p => p.textContent = 'Close Series −');

          requestAnimationFrame(() => {
            const elementTop = section.getBoundingClientRect().top + window.pageYOffset;
            const targetPosition = elementTop - navHeight - 15;

            window.scrollTo({
              top: Math.max(0, targetPosition),
              behavior: 'instant'
            });
          });

        } else {
          section.classList.remove('expanded');
          section.querySelectorAll('.expand-prompt').forEach(p => p.textContent = 'View Series +');

          const elementPosition = section.getBoundingClientRect().top + window.pageYOffset;
          const offsetPosition = elementPosition - navHeight - 15;

          window.scrollTo({
            top: Math.max(0, offsetPosition),
            behavior: 'instant'
          });
        }
        pauseAllVideosOnPage();
      };

      function pauseAllVideosOnPage() {
  document.querySelectorAll('video, mux-video').forEach((media) => {
    if (typeof media.pause === 'function') {
      media.pause();
    }
  });
}

      document.querySelectorAll('.view-series-trigger').forEach(trigger => {
        trigger.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const section = trigger.closest('.project-section');
          toggleSeries(section);
        });
      });

      

  document.querySelectorAll('.carousel-end-link').forEach(link => {
  link.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const section = link.closest('.project-section'); 
    toggleSeries(section);
  });
});

      document.querySelectorAll('.project-gallery-wrapper').forEach(wrapper => {
        
        wrapper.addEventListener('mousemove', (e) => {
          const section = wrapper.closest('.project-section');
          if (section && section.classList.contains('expanded')) return;

          const rect = wrapper.getBoundingClientRect();
          const mouseX = e.clientX - rect.left;

          if (mouseX < rect.width / 2) {
            wrapper.style.cursor = `url("${leftArrowSVG}") 16 16, w-resize`;
          } else {
            wrapper.style.cursor = `url("${rightArrowSVG}") 16 16, e-resize`;
          }
        });

        wrapper.addEventListener('click', (e) => {
          const section = wrapper.closest('.project-section');
          if (section && section.classList.contains('expanded')) return;

          if (e.target.closest('.carousel-end-link') || e.target.tagName.toLowerCase() === 'video') return;

          const items = Array.from(wrapper.querySelectorAll('.gallery-item'));
          if (!items.length) return;

          const firstItem = items[0];
          const track = wrapper.querySelector('.project-gallery-track');
          const gap = track ? parseFloat(window.getComputedStyle(track).gap || 0) : 0;
          const stepWidth = firstItem.offsetWidth + gap;

          const rect = wrapper.getBoundingClientRect();
          const mouseX = e.clientX - rect.left;

          if (mouseX >= rect.width / 2) {
            wrapper.scrollBy({ left: stepWidth, behavior: 'smooth' });
          } else {
            wrapper.scrollBy({ left: -stepWidth, behavior: 'smooth' });
          }
        });
      });

      const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const item = entry.target;
            const img = item.querySelector('img');

            if (img && img.dataset.src) {
              img.src = img.dataset.src;
              img.onload = () => item.classList.add('loaded');
            } else {
              item.classList.add('loaded');
            }
            observer.unobserve(item);
          }
        });
      }, {
        rootMargin: '100px',
        threshold: 0.05
      });

      document.querySelectorAll('.gallery-item').forEach(item => {
        imageObserver.observe(item);
      });
    }

    function getFallbackData() {
      return [];
    }

    loadProjects();
  });
  </script>
</body>
</html>
