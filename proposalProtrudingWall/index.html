<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Model Viewer Starter</title>
    
    <!-- 1. Import the <model-viewer> library -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: sans-serif;
            background-color: #f4f4f9;
        }

        /* 2. Style the viewer container */
        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }

        /* 3. Style the custom AR button (optional, but looks cleaner) */
        #ar-button {
            background-color: #ffffff;
            border-radius: 4px;
            border: none;
            box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.25);
            color: #4285f4;
            display: block;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: 500;
            height: 42px;
            line-height: 42px;
            padding: 0 16px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 32px;
            z-index: 999;
        }

        #ar-button:active {
            background-color: #f1f3f4;
        }

        #ar-button:focus {
            outline: none;
        }

        #ar-button:focus-visible {
            outline: 1px solid #4285f4;
        }
    </style>
</head>
<body>

    <!-- 4. The Model Viewer Component -->
    <!-- Swap 'your-model.glb' and 'your-model.usdz' with your actual file paths or URLs -->
    <model-viewer 
        src="Untitled.glb" 
        ios-src="Untitled.usdz"
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        touch-action="pan-y"
        alt="A 3D model viewed in AR"
        shadow-intensity="1">
        
        <button slot="ar-button" id="ar-button">
            👋 View in your space
        </button>
        
    </model-viewer>

</body>
</html>
