<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About — Jordan Oleson-Graves</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Hanken Grotesk Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. Global Resets & Design Tokens
       ========================================================================== */
    :root {
      --bg-color: #ffffff;
      --text-color: #111111;
      --text-muted: #666666;
      --border-color: #e5e5e5;
      
      /* Vibrant Alternating Header Colors */
      --header-red-bg: repeating-linear-gradient(
        -85deg,
        #E63946,
        #E63946 10px,
        #C92A3700 10px,
        #C92A3700 20px
      );

      --header-blue-bg: repeating-linear-gradient(
        -85deg,
        #0357cd,
        #0357cd 10px,
        #044eb600 10px,
        #044eb600 20px
      );

      --header-black-bg: repeating-linear-gradient(
        -85deg,
        #000000,
        #000000 10px,
        #044eb600 10px,
        #044eb600 20px
      );

      --header-red-bg-small: repeating-linear-gradient(-85deg, #E63946, #E63946 5px, #C92A3700 5px, #C92A3700 10px);
      --header-blue-bg-small: repeating-linear-gradient(-85deg, #0357cd, #0357cd 5px, #044eb600 5px, #044eb600 10px);
      --header-black-bg-small: repeating-linear-gradient(-85deg, #000000, #000000 5px, #044eb600 5px, #044eb600 10px);

      --header-text-light: #ffffff;
      --nav-height: 55px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: var(--text-color);
      line-height: 1.5;
      overflow-x: hidden;
      background-color: white;
      
      /* Flex layout to stretch elements vertically */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      display: block;
      pointer-events: none;
    }

    #bg::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(0deg, #039c8a 30%, rgb(0, 0, 98) 50%, rgb(255, 98, 98) 70%);
      -webkit-mask-image: url("lines.png");
      mask-image: url("lines.png");
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ==========================================================================
       2. Sticky Navigation Bar
       ========================================================================== */
    nav.sticky-nav {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--nav-height);
      z-index: 1000;
      background-color: black;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5%;
      flex-shrink: 0;
    }

    .nav-logo {
      font-size: clamp(1rem, 1.4vw, 1.5rem);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      color: white;
    }

    nav ul {
      display: flex;
      gap: 1.75rem;
      list-style: none;
    }

    nav a {
      font-size: clamp(1rem, 1.4vw, 1.5rem);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 500;
      position: relative;
      padding-bottom: 3px;
      color: white;
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0%;
      height: 1px;
      background: white;
      transition: width 0.3s ease;
    }

    nav a:hover::after,
    nav a.active::after {
      width: 100%;
    }

    nav ul li {
  display: flex;
  align-items: center;
}

nav a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* Size SVG relative to cap-height and prevent layout shifts */
nav a.nav-cart-link svg {
  display: block;
  width: auto;
  /* Matches cap height of Hanken Grotesk text links */
  height: 0.9em; 
  fill: currentColor;
  /* Slight optical adjustment to seat centered with capital letters */
  transform: translateY(-0.05em); 
}

/* Thicken the icon path lines */
nav a.nav-cart-link svg path {
  stroke: currentColor;
  stroke-width: 0.75px; /* Adjust between 0.5px and 1.2px to dial in boldness */
  stroke-linejoin: round;
}

#projectInfoWrapper {
  margin-inline: 10vw;
}

    /* ==========================================================================
       3. Main Layout & Accordion Sections
       ========================================================================== */
    main#about {
      flex: 0 0 auto;
      width: 100%;
    }

    .about-section {
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid var(--border-color);
      position: relative;
      width: 100%;
    }

    .about-info {
      width: 100%;
      z-index: 10;
      color: var(--header-text-light);
      position: relative;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s ease;
    }

    .about-info:hover {
      opacity: 0.95;
    }

    .about-info-sticky {
      padding: 1.1rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .about-section[data-theme="red"] .about-info { background: var(--header-red-bg); }
    .about-section[data-theme="blue"] .about-info { background: var(--header-blue-bg); }
    .about-section[data-theme="black"] .about-info { background: var(--header-black-bg); }

    .about-info h2 {
      font-size: clamp(1.2rem, 1.8vw, 2rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
      background-color: white;
      color: black;
      padding: 4px 12px;
      width: fit-content;
      margin: 0;
    }

.accordion-toggle-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  background-color: white;
  color: black;
  font-size: 1.2rem;
  font-weight: 600;
  line-height: 1;
  border-radius: 50%;
  /* Slower rotation matching container speed */
  transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
}

    /* Relative Wrapper to Hold Scroll Gradient Fade Overlay */
    .about-content-wrapper {
      position: relative;
      width: 100%;
    }

    /* White Gradient Scroll Cue Fade at Bottom of Section */
    .about-content-wrapper::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.95) 100%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 5;
    }

    .about-section.expanded .about-content-wrapper.has-scroll::after {
      opacity: 1;
    }

    .about-section.expanded .about-content-wrapper.scrolled-bottom::after {
      opacity: 0;
    }

  /* Accordion Content States & Scroll Container */
.about-content-container {
  width: 100%;
  max-height: 0;
  overflow-y: hidden;
  opacity: 0;
  padding: 0 5%;
  background-color: #ffffff;
  /* Slower, smooth collapse transition when closing */
  transition: max-height 0.8s cubic-bezier(0.25, 1, 0.5, 1),
              padding 0.6s cubic-bezier(0.25, 1, 0.5, 1),
              opacity 0.4s ease 0s;
}

/* Cap height to 55vh and enable scrolling */
.about-section.expanded .about-content-container {
  max-height: 55vh;
  overflow-y: auto;
  opacity: 1;
  padding: 2.5rem 5%;
  /* Slower, smooth expand transition when opening */
  transition: max-height 0.8s cubic-bezier(0.25, 1, 0.5, 1),
              padding 0.6s cubic-bezier(0.25, 1, 0.5, 1),
              opacity 0.5s ease 0.2s;
}

    /* Custom Scrollbar */
    .about-content-container::-webkit-scrollbar {
      width: 6px;
    }
    .about-content-container::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    .about-content-container::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 3px;
    }
    .about-content-container::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    .about-section.expanded .accordion-toggle-icon {
      transform: rotate(45deg);
    }

    /* Section Specific Stylings */
    .bio-wrapper {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2.5rem;
      align-items: start;
    }

    .bio-headshot img {
      width: 100%;
      height: auto;
      object-fit: cover;
      display: block;
    }

    .bio-text {
      font-size: clamp(1.05rem, 1.25vw, 1.35rem);
      line-height: 1.7;
      color: var(--text-color);
    }

    .statement-text p {
      font-size: clamp(1.05rem, 1.25vw, 1.3rem);
      line-height: 1.75;
      color: var(--text-color);
      margin-bottom: 1.5rem;
      max-width: 90ch;
    }

    .statement-text p:last-child {
      margin-bottom: 0;
    }

    /* CV Layout */
    .cv-group {
      margin-bottom: 2.5rem;
    }

    .cv-group:last-child {
      margin-bottom: 0;
    }

    .cv-group-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      color: var(--text-color);
      margin-bottom: 1rem;
      border-bottom: 2px solid black;
      padding-bottom: 0.4rem;
    }

    .cv-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .cv-item {
      display: flex;
      justify-content: space-between;
      gap: 2rem;
      align-items: baseline;
    }

    .cv-item-main {
      display: flex;
      flex-direction: column;
    }

    .cv-title {
      font-weight: 600;
      font-size: 1.05rem;
    }

    .cv-sub {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .cv-period {
      font-size: 0.9rem;
      color: var(--text-muted);
      white-space: nowrap;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* ==========================================================================
       4. Full-Height Site Footer
       ========================================================================== */
    footer.site-footer {
      flex: 1; /* Takes up all remaining vertical space */
      padding: 2.5rem 5%;
      background-color: #000000;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1.5rem;
      color: white;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      width: 100%;
    }

    .footer-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      white-space: nowrap;
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .footer-link {
      font-size: clamp(0.95rem, 1.2vw, 1.15rem);
      font-weight: 500;
      border-bottom: 1px solid white;
      padding-bottom: 2px;
      transition: opacity 0.2s ease;
      white-space: nowrap;
    }

    .footer-link:hover { opacity: 0.6; }

    /* ==========================================================================
       5. Responsive Breakpoints
       ========================================================================== */
    @media (max-width: 900px) {
      .bio-wrapper {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      #bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        height: -webkit-fill-available;
        z-index: -1;
        display: block;
        background-blend-mode: lighten;
        -webkit-transform: translate3d(0, 0, 0);
        transform: translate3d(0, 0, 0);
        pointer-events: none;
      }

      #bg::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(0deg, rgb(3, 156, 138) 30%, rgb(0, 0, 98) 50%, rgb(255, 98, 98) 70%);
        -webkit-mask-image: url("lines2.png");
        mask-image: url("lines2.png");
      }

      nav ul {
        gap: 0.85rem;
      }

      nav a {
        font-size: 0.75rem;
        letter-spacing: 0.04em;
      }

      .about-info-sticky {
        padding: 0.9rem 5%;
      }

      .about-info h2 {
        font-size: clamp(1rem, 3.5vw, 1.3rem);
      }

      .accordion-toggle-icon {
        width: 26px;
        height: 26px;
        font-size: 1.1rem;
      }

      .about-section.expanded .about-content-container {
        padding: 1.5rem 5%;
        max-height: 50vh;
      }

      .cv-item {
        flex-direction: column;
        gap: 0.2rem;
      }

      .cv-period {
        text-align: left;
      }

      /* Mobile layout adjustments */
      footer.site-footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
        padding: 1.5rem 5%;
         justify-content: flex-start;
      }

      .footer-links {
        gap: 1.25rem;
        width: 100%;
      }

      .about-section[data-theme="red"] .about-info { background: var(--header-red-bg-small); }
      .about-section[data-theme="blue"] .about-info { background: var(--header-blue-bg-small); }
      .about-section[data-theme="black"] .about-info { background: var(--header-black-bg-small); }
    }
  </style>
</head>
<body>
  <div id="bg"></div>

  <!-- Sticky Navigation Bar -->
<nav class="sticky-nav">
  <div class="nav-logo"><a href="/">JORDAN OLESON-GRAVES</a></div>
  <ul>
    <li><a href="/">Work</a></li>
    <li><a href="/about" class="active">About</a></li>
    <li><a href="/shop" >Shop</a></li>
    <li>
      <a href="../shop#!/~/cart" class="nav-cart-link" aria-label="Shopping Cart">
        <svg viewBox="0 0 16 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g fill="none" fill-rule="evenodd">
            <path
              d="M1 5v13.006c0 .548.446.994.994.994h12.012c.548 0 .994-.446.994-.994V5H1zm15-1v14.006c0 1.1-.895 1.994-1.994 1.994H1.994C.894 20 0 19.105 0 18.006V4h16z"
              fill="currentColor" fill-rule="nonzero"></path>
            <path
              d="M5 7s-.005.5-.504.5C3.996 7.5 4 7 4 7V4c0-2.21 1.79-4 4-4s4 1.79 4 4v3s-.002.5-.5.5S11 7 11 7V4c0-1.657-1.343-3-3-3S5 2.343 5 4v3z"
              fill="currentColor"></path>
          </g>
        </svg>
      </a>
    </li>
  </ul>
</nav>

  <!-- Main Dynamic About Target -->
  <main id="about"></main>

  <!-- Site Footer taking remaining space -->
  <footer class="site-footer" id="contact">
    <span class="footer-label">Get in Touch</span>
    <div class="footer-links">
      <a href="mailto:jordan@jordangrav.es" class="footer-link">jordan@jordangrav.es</a>
      <a href="https://instagram.com/jordanolesongraves" target="_blank" rel="noopener" class="footer-link">@jordanolesongraves</a>
    </div>
  </footer>

  <script>
document.addEventListener('DOMContentLoaded', () => {

  async function loadAboutData() {
    try {
      const response = await fetch('/about/cv.json');
      if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
      const data = await response.json();
      renderAbout(data);
    } catch (error) {
      console.warn('Fetching cv.json directly failed. Loading embedded dataset.', error);
      // Ensure fallback or fallback caller is present if needed
    }
  }

  function renderAbout(data) {
    const main = document.getElementById('about');

    // Helper to render section blocks cleanly
    const renderCvGroup = (title, items, formatFn) => {
      if (!items || !items.length) return '';
      return `
        <div class="cv-group">
          <div class="cv-group-title">${title}</div>
          <div class="cv-list">
            ${items.map(formatFn).join('')}
          </div>
        </div>
      `;
    };

    // Flatten nested publications object into a single iterable list
    const publicationsList = data.cv?.publications ? [
      ...(data.cv.publications.peerReviewedConferences || []),
      ...(data.cv.publications.peerReviewedWorkshops || []),
      ...(data.cv.publications.peerReviewedDemos || [])
    ] : [];

    main.innerHTML = `
      <!-- SECTION 1: BIO & HEADSHOT -->
      <section class="about-section expanded" data-theme="red" data-index="0">
        <div class="about-info" role="button" aria-expanded="true" tabindex="0">
          <div class="about-info-sticky">
            <h2>Biography</h2>
            <span class="accordion-toggle-icon" aria-hidden="true">+</span>
          </div>
        </div>
        <div class="about-content-wrapper">
          <div class="about-content-container">
            <div class="bio-wrapper">
              <div class="bio-text">
                ${Array.isArray(data.bio) 
                  ? data.bio.map(p => `<p>${p}</p>`).join('') 
                  : `<p>${data.bio || ''}</p>`}
              </div>
              ${data.headshot ? `
                <div class="bio-headshot">
                  <img src="${data.headshot.src}" alt="${data.headshot.alt}" />
                </div>
              ` : ''}
            </div>
          </div>
        </div>
      </section>

      <!-- SECTION 2: STATEMENT -->
      <section class="about-section" data-theme="blue" data-index="1">
        <div class="about-info" role="button" aria-expanded="false" tabindex="0">
          <div class="about-info-sticky">
            <h2>Artist Statement</h2>
            <span class="accordion-toggle-icon" aria-hidden="true">+</span>
          </div>
        </div>
        <div class="about-content-wrapper">
          <div class="about-content-container">
            <div class="statement-text">
              ${Array.isArray(data.statement) 
                ? data.statement.map(p => `<p>${p}</p>`).join('') 
                : `<p>${data.statement || ''}</p>`}
            </div>
          </div>
        </div>
      </section>

      <!-- SECTION 3: CURRICULUM VITAE -->
      <section class="about-section" data-theme="black" data-index="2">
        <div class="about-info" role="button" aria-expanded="false" tabindex="0">
          <div class="about-info-sticky">
            <h2>Curriculum Vitae</h2>
            <span class="accordion-toggle-icon" aria-hidden="true">+</span>
          </div>
        </div>
        <div class="about-content-wrapper">
          <div class="about-content-container">
            <div class="cv-container">
              
              <!-- Education -->
              ${renderCvGroup('Education', data.cv?.education, item => `
                <div class="cv-item">
                  <div class="cv-item-main">
                    <span class="cv-title">${item.degree}</span>
                    <span class="cv-sub">${item.institution}</span>
                  </div>
                  <span class="cv-period">${item.year}</span>
                </div>
              `)}

              <!-- Professional Experience -->
              ${renderCvGroup('Professional Experience', data.cv?.professionalExperience, item => `
                <div class="cv-item">
                  <div class="cv-item-main">
                    <span class="cv-title">${item.role}</span>
                    <span class="cv-sub">${item.organization}</span>
                  </div>
                  <span class="cv-period">${item.period}</span>
                </div>
              `)}

              <!-- Selected Exhibitions -->
              ${renderCvGroup('Selected Exhibitions', data.cv?.selectedExhibitions, item => `
                <div class="cv-item">
                  <div class="cv-item-main">
                    <span class="cv-title">${item.title} ${item.type ? `(${item.type})` : ''}</span>
                    <span class="cv-sub">${item.venue}${item.location ? `, ${item.location}` : ''}</span>
                  </div>
                  <span class="cv-period">${item.period}</span>
                </div>
              `)}

              <!-- Museum Exhibitions -->
              ${renderCvGroup('Museum Exhibitions', data.cv?.museumExhibitions, item => `
                <div class="cv-item">
                  <div class="cv-item-main">
                    <span class="cv-title">${item.project}</span>
                    <span class="cv-sub">${item.venue}${item.location ? `, ${item.location}` : ''}</span>
                  </div>
                  <span class="cv-period">${item.period}</span>
                </div>
              `)}

              <!-- Permanent Public Art -->
              ${renderCvGroup('Permanent Public Art and Commissions', data.cv?.permanentPublicArt, item => `
                <div class="cv-item">
                  <div class="cv-item-main">
                    <span class="cv-title">${item.title}</span>
                    <span class="cv-sub">${item.location}</span>
                  </div>
                </div>
              `)}

              <!-- Temporary Public Art -->
              ${renderCvGroup('Temporary Public Art', data.cv?.temporaryPublicArt, item => `
                <div class="cv-item">
                  <div class="cv-item-main">
                    <span class="cv-title">${item.title}</span>
                    <span class="cv-sub">${item.location}</span>
                  </div>
                  <span class="cv-period">${item.period}</span>
                </div>
              `)}

              <!-- Public Art Commission Finalists -->
              ${renderCvGroup('Public Art Commission Finalists', data.cv?.publicArtCommissionFinalists, item => `
                <div class="cv-item">
                  <div class="cv-item-main">
                    <span class="cv-title">${item.project}</span>
                    <span class="cv-sub">${item.organization}${item.location ? `, ${item.location}` : ''}</span>
                  </div>
                </div>
              `)}

              <!-- Artist Residencies -->
              ${renderCvGroup('Artist Residencies', data.cv?.residencies, item => `
                <div class="cv-item">
                  <div class="cv-item-main">
                    <span class="cv-title">${item.organization}</span>
                    <span class="cv-sub">${item.location}</span>
                  </div>
                  <span class="cv-period">${item.year}</span>
                </div>
              `)}

              <!-- Workshops Taught -->
              ${renderCvGroup('Workshops Taught', data.cv?.workshopsTaught, item => `
                <div class="cv-item">
                  <div class="cv-item-main">
                    <span class="cv-title">${item.title}</span>
                    <span class="cv-sub">${item.venue}${item.location ? `, ${item.location}` : ''}</span>
                  </div>
                  <span class="cv-period">${item.date}</span>
                </div>
              `)}

              <!-- Peer-Reviewed Publications -->
              ${renderCvGroup('Publications', publicationsList, item => `
                <div class="cv-item">

      </section>
    `;

    attachAccordionListeners();
    setupScrollDetectors();
  }


      function attachAccordionListeners() {
        const headers = document.querySelectorAll('.about-info');
        const sections = Array.from(document.querySelectorAll('.about-section'));

        headers.forEach((header, index) => {
          const toggleSection = () => {
            const currentSection = sections[index];
            const isCurrentlyExpanded = currentSection.classList.contains('expanded');

            let targetIndex;

            if (isCurrentlyExpanded) {
              targetIndex = (index + 1) % sections.length;
            } else {
              targetIndex = index;
            }

            sections.forEach((sec, idx) => {
              const secHeader = sec.querySelector('.about-info');
              if (idx === targetIndex) {
                sec.classList.add('expanded');
                if (secHeader) secHeader.setAttribute('aria-expanded', 'true');
              } else {
                sec.classList.remove('expanded');
                if (secHeader) secHeader.setAttribute('aria-expanded', 'false');
              }
            });

            setTimeout(checkScrollStates, 100);
          };

          header.addEventListener('click', toggleSection);

          header.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              toggleSection();
            }
          });
        });
      }

      function setupScrollDetectors() {
        const containers = document.querySelectorAll('.about-content-container');

        containers.forEach(container => {
          const wrapper = container.closest('.about-content-wrapper');

          container.addEventListener('scroll', () => {
            if (!wrapper) return;
            const isAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 10;
            if (isAtBottom) {
              wrapper.classList.add('scrolled-bottom');
            } else {
              wrapper.classList.remove('scrolled-bottom');
            }
          });
        });

        window.addEventListener('resize', checkScrollStates);
        checkScrollStates();
      }

      function checkScrollStates() {
        const containers = document.querySelectorAll('.about-content-container');
        containers.forEach(container => {
          const wrapper = container.closest('.about-content-wrapper');
          if (!wrapper) return;

          const hasScrollableContent = container.scrollHeight > container.clientHeight;
          if (hasScrollableContent) {
            wrapper.classList.add('has-scroll');
          } else {
            wrapper.classList.remove('has-scroll');
          }

          const isAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 10;
          if (isAtBottom) {
            wrapper.classList.add('scrolled-bottom');
          } else {
            wrapper.classList.remove('scrolled-bottom');
          }
        });
      }
